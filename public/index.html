<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammarly-ish | AI Text Humaniser</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 transition-colors duration-500 selection-custom antialiased relative overflow-hidden">

    <div class="absolute inset-0 bg-[#e2e8f0] z-0"></div>

    <div id="login-screen" class="z-10 w-full max-w-sm transition-all duration-700 ease-in-out">
        <div class="cyber-panel p-8 flex flex-col gap-6 relative overflow-hidden">
            <div class="noise-overlay"></div>

            <div class="relative z-10">
                <div class="flex gap-2 mb-8">
                    <div class="w-3 h-3 rounded-full bg-[#FF5F56] shadow-[0_0_8px_#FF5F5680]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#FFBD2E] shadow-[0_0_8px_#FFBD2E80]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#27C93F] shadow-[0_0_8px_#27C93F80]"></div>
                </div>

                <h1 class="text-xl font-medium text-slate-200 mb-6 font-mono">GRAMMARLY-ISH v1.0</h1>

                <form id="login-form" class="space-y-4">
                    <div>
                        <input type="text" id="username-input" placeholder="Username" autocomplete="off"
                            class="w-full bg-[#0f172a]/50 border border-slate-700 rounded-lg p-3 text-slate-200 font-mono text-sm outline-none focus:border-blue-500 focus:shadow-[0_0_15px_rgba(59,130,246,0.2)] transition-all placeholder:text-slate-500">
                    </div>
                    <div>
                        <input type="password" id="password-input" placeholder="Password"
                            class="w-full bg-[#0f172a]/50 border border-slate-700 rounded-lg p-3 text-slate-200 font-mono text-sm outline-none focus:border-blue-500 focus:shadow-[0_0_15px_rgba(59,130,246,0.2)] transition-all placeholder:text-slate-500">
                        <p id="login-error" class="text-red-400 font-mono text-xs mt-2 hidden glow-red">ACCESS DENIED</p>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-mono text-sm py-3 rounded-lg transition-all active:scale-[0.98]">
                        INITIALIZE
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="app-screen" class="z-10 w-full max-w-6xl hidden opacity-0 transition-all duration-1000 ease-in-out">

        <div class="main-wrapper rounded-[2.5rem] p-3 md:p-4 shadow-[0_20px_50px_rgba(0,0,0,0.3),0_0_0_1px_rgba(255,255,255,0.1)]">

            <div class="cyber-panel rounded-[2rem] w-full h-[750px] flex flex-col relative overflow-hidden">
                <div class="noise-overlay"></div>

                <div class="relative z-10 flex flex-col h-full p-6 md:p-8">

                    <div class="flex justify-between items-center mb-8 border-b border-slate-800/80 pb-6">
                        <div class="flex gap-2">
                            <div class="w-3.5 h-3.5 rounded-full bg-[#FF5F56] shadow-[0_0_10px_rgba(255,95,86,0.4)]"></div>
                            <div class="w-3.5 h-3.5 rounded-full bg-[#FFBD2E] shadow-[0_0_10px_rgba(255,189,46,0.4)]"></div>
                            <div class="w-3.5 h-3.5 rounded-full bg-[#27C93F] shadow-[0_0_10px_rgba(39,201,63,0.4)]"></div>
                        </div>

                        <div class="font-mono text-[#27C93F] text-xs tracking-widest glow-green flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#27C93F] animate-pulse"></span>
                            CONNECTED_01
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 overflow-hidden">

                        <div class="inner-card flex flex-col relative group h-full">
                            <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-500/10 rounded-full blur-[80px] pointer-events-none group-hover:bg-blue-500/15 transition-all duration-700"></div>

                            <div class="absolute top-6 left-6 flex flex-col gap-2 pointer-events-none opacity-20">
                                <div class="h-2 w-24 bg-slate-400 rounded-full"></div>
                                <div class="h-2 w-48 bg-slate-400 rounded-full"></div>
                            </div>

                            <textarea id="input-text" placeholder="Awaiting synthetic data input..."
                                class="flex-1 w-full bg-transparent text-slate-300 font-sans text-base leading-relaxed p-6 pt-16 outline-none resize-none placeholder:text-slate-600 z-10 custom-scrollbar"></textarea>
                        </div>

                        <div class="inner-card flex flex-col relative h-full">

                            <div class="absolute top-4 right-4 z-20">
                                <button id="copy-btn" disabled class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700/50 backdrop-blur-sm transition-all duration-300 opacity-0 disabled:hidden">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    <span class="font-mono text-xs">COPY</span>
                                </button>
                            </div>

                            <div id="loader-container" class="absolute inset-0 flex items-center justify-center z-10 hidden bg-[#0a0f1c]/50 backdrop-blur-sm">
                                <div class="relative flex items-center justify-center">
                                    <svg class="w-24 h-24 transform -rotate-90" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="4"></circle>
                                        <circle class="animate-progress glow-pink" cx="50" cy="50" r="40" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="251.2" stroke-dashoffset="180"></circle>
                                    </svg>
                                    <span class="absolute font-mono text-[10px] text-pink-500 tracking-widest animate-pulse">SYNC</span>
                                </div>
                            </div>

                            <div class="flex-1 p-6 pt-16 overflow-y-auto custom-scrollbar z-10 relative min-h-0">
                                <p id="output-placeholder" class="text-slate-600 font-mono text-sm text-center mt-20 opacity-50">
                                    > System standby.<br>> Output stream will render here.
                                </p>
                                <p id="output-text" class="text-slate-300 font-sans text-base leading-relaxed whitespace-pre-wrap hidden"></p>
                                <p id="api-error" class="text-red-400 font-mono text-sm mt-4 hidden glow-red"></p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-between items-end">
                        <button id="humanise-btn" class="cyber-button font-mono text-sm text-white px-8 py-3 rounded-lg flex items-center gap-2 opacity-50 cursor-not-allowed transition-all duration-300">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                            EXECUTE // HUMANISE
                        </button>

                        <div class="flex items-center gap-2 font-mono text-[10px] text-slate-500">
                            <span class="w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_5px_#ef4444] animate-pulse"></span>
                            PWR
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
